# Local development dependencies including docs building, website upload, ASV benchmark
name: regex-toolkit
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip

  # Code checks
  - black=22.10.0
  - pylint>=3.0.0
  - isort>=5.2.1
  - mypy=1.0
  - codespell>=2.0.0

  # Test dependencies
  - pytest>=7.0.0
  - pytest-cov>=6.0.0
  - pip:
    - google-re2>=1.0
