name: Build regex_toolkit
description: Build regex_toolkit
runs:
  using: composite
  steps:
    - name: Environment Detail
      run: |
        micromamba info
        micromamba list
      shell: micromamba-shell {0}

    - name: Build Regex-Toolkit
      run: |
        python -m pip install -e . --no-build-isolation --no-index
      shell: micromamba-shell {0}
